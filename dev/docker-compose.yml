services:
    app:
        build:
            context: ../
            dockerfile: ./dev/docker/php/Dockerfile
            args:
                XDEBUG_VERSION: ${XDEBUG_VERSION}
                PHP_VERSION: ${PHP_VERSION:-8.4}
                LOCAL_UID: ${LOCAL_UID:-1000}
                LOCAL_GID: ${LOCAL_GID:-1000}
        restart: unless-stopped
        working_dir: /var/www/html
        volumes:
            - ../:/var/www/html
            - ./docker/php/php.ini:/usr/local/etc/php/php.ini:ro
        environment:
            PHP_IDE_CONFIG: ${PHP_IDE_CONFIG}
            XDEBUG_MODE: ${XDEBUG_MODE}
            XDEBUG_CONFIG: client_host=${XDEBUG_CLIENT_HOST} client_port=${XDEBUG_CLIENT_PORT}
            XDEBUG_START_WITH_REQUEST: ${XDEBUG_START_WITH_REQUEST}
            XDEBUG_DISCOVER_CLIENT_HOST: ${XDEBUG_DISCOVER_CLIENT_HOST}
            XDG_CONFIG_HOME: /tmp/.config
        networks:
            - net
        depends_on:
            mysql:
                condition: service_healthy

    mysql:
        image: mysql:8.4
        healthcheck:
            test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root --silent"]
            interval: 2s
            timeout: 3s
            retries: 30
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_USER: ${DB_USERNAME}
            MYSQL_PASSWORD: ${DB_PASSWORD}
            MYSQL_RANDOM_ROOT_PASSWORD: "yes"
        ports:
            - "${EXT_DB_PORT}:${DB_PORT}"
        volumes:
            - mysql-data:/var/lib/mysql
        networks:
            - net

    web:
        image: nginx:alpine
        restart: unless-stopped
        ports:
            - "${EXT_WEB_PORT}:80"
        volumes:
            - ../:/var/www/html
            - ./docker/nginx:/etc/nginx/conf.d:ro
        networks:
            - net
        depends_on:
            - app

volumes:
    mysql-data:

networks:
    net:
        driver: bridge
