services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  App\:
    resource: '../app/*'
    exclude:
      - '../app/DependencyInjection/'
      - '../app/ServiceProviders/'

  App\Http\Controllers\:
    resource: '../app/Http/Controllers/*'
    public: true

  App\DependencyInjection\ServiceContainer:
    arguments: ['@service_container']

  App\DependencyInjection\ContainerInterface:
    alias: App\DependencyInjection\ServiceContainer
    public: true

  Psr\Container\ContainerInterface:
    alias: App\DependencyInjection\ServiceContainer
